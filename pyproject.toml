[tool.poetry]
name = "autonomous-orchestrator"
version = "0.1.0"
description = "Autonomous AI Orchestrator for Enterprise App Development"
authors = ["AI Orchestrator Team <team@company.com>"]

[tool.poetry.dependencies]
python = "^3.12"
Flask = "^3.1"
python-dotenv = "^1.0"
GitPython = "^3.1"
langchain = "^0.1"
crewai = "^0.30"
pydantic = "^2.8"
SQLAlchemy = { version = "^2.0", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
mypy = "^1.11"
ruff = "^0.6"
black = "^24.0"
isort = "^5.13"
bandit = "^1.7"
safety = "^3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100